appId: com.curso.shopdemo
---
- retry:
    maxRetries: 2
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: "input-email"
          timeout: 60000

- tapOn:
    id: "input-email"
- inputText: "cliente@shopdemo.com"

- tapOn:
    id: "input-senha"
- inputText: "123456"

- hideKeyboard

- tapOn:
    id: "btn-entrar"

- extendedWaitUntil:
    visible:
        id: "tela-catalogo"
    timeout: 40000

- assertVisible: 
    id: "tela-catalogo"